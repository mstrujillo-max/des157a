<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game Version 1</title>

    <link rel="stylesheet" href="styles.css">

    <!-- unbounded font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">

    <script src="script.js" defer></script> 

</head>
<body>
    <main>
        <h1>Star Dance</h1>
        <h2>Watch the stars dance and see if<br> you can repeat their movements!</h2>

        <section id="game">
            <div id="pad1"></div>
            <div id="pad2"></div>
            <div id="pad3"></div>
            <div id="pad4"></div>
        </section>

        <p id="message">Click the start game button to start</p>

        <section id="controls">
        <p id="action"><a href="#">Start Game</a></p> 
        <p id="score">Current Score: <span>0</span></p>
        </section>

    </main>
    
</body>
</html>
